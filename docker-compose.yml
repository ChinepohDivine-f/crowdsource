version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: crowdsource_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: drive_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  # Backend service
  backend:
    build: ./backend
    container_name: crowdsource_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Use the container name 'db' as the host, but internal port 5432
      DATABASE_URL: postgresql://user:password@db:5432/drive_test
    restart: unless-stopped

volumes:
  postgres_data:
